[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BSR"
version = "0.1.0"
description = "Code for Bilinear sparse regression for RNAseq analysis"
authors = [
    { name="Jordi Alonso Esteve", email="j.alonsoesteve@uva.nl" }
]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]