[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BRIDGE"
version = "0.1.0"
description = "Code for Bilinear sparse regression for RNAseq analysis"
authors = [
    { name="Jordi Alonso Esteve", email="j.alonsoesteve@uva.nl" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "polars>=1.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "diskcache>=5.6",
    "tqdm>=4.66",
    "biopython>=1.83",
    "jax[cuda13]",
    "optuna>=4.0",
    "scanpy>=1.11.5"
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]